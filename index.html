<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory Test Room Reservation</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div><h1>Factory Test Room Reservation</h1><p>Panel 예약 현황 및 위치 관리</p></div><div id="updated"></div></header>
<main><section class="side card"><h2>예약 현황</h2><div class="filters"><input id="projectFilter" placeholder="프로젝트 검색"><input id="fromFilter" type="date"><input id="toFilter" type="date"><button id="searchBtn">조회</button></div><div class="legend"><span><i class="free"></i>예약 가능</span><span><i class="busy"></i>현재 예약</span><span><i class="selected"></i>선택</span></div><div class="table-wrap"><table><thead><tr><th>프로젝트</th><th>Panel</th><th>기간</th><th>담당자</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="layout card"><h2>Factory Test Room Layout</h2><div id="layoutBox"><div class="room-label">TEST ROOM</div></div><div id="detail" class="detail">예약 또는 Panel을 선택하세요.</div></section>
<section class="booking card"><h2>신규 예약</h2><form id="bookingForm"><label>Panel<select id="panelId" required></select></label><label>프로젝트명<input id="projectName" required maxlength="150"></label><label>발주번호<input id="po" maxlength="80"></label><label>담당자<input id="requester" required maxlength="80"></label><div class="two"><label>시작일<input id="startDate" type="date" required></label><label>종료일<input id="endDate" type="date" required></label></div><label>비고<textarea id="note" maxlength="1000"></textarea></label><button class="primary">예약 저장</button><p id="message" role="status"></p></form></section></main>
<script src="/static/app.js"></script></body></html>
