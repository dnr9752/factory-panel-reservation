services:
  - type: web
    name: factory-panel-reservation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factory-panel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: factory-panel-db
    plan: free
